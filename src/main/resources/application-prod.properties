# Production profile. Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Required environment variables:
#   DB_URL       JDBC URL *including the database name*, e.g.
#                jdbc:mysql://localhost:3306/portfolio?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#                The database must already exist:
#                  CREATE DATABASE portfolio CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#                (Hibernate creates the contact_messages table on first boot via ddl-auto=update;
#                 the URL just needs to point at an existing database.)
#   DB_USERNAME  e.g. portfolio
#   DB_PASSWORD  (secret — never commit this file with real values)
# Optional:
#   PORT         defaults to 8080 (Render/Heroku-style platforms inject this)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false

spring.thymeleaf.cache=true

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI + api-docs are disabled in prod (public surface).
# Re-enable temporarily via env if needed: SPRINGDOC_API_DOCS_ENABLED / SPRINGDOC_SWAGGER_UI_ENABLED
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
